
name: Build Money Alert APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o MoneyAlert-Android-Source-Fixed.zip -d work

      - name: Compile APK
        run: gradle -p work/MoneyAlert :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyAlert-APK
          path: work/MoneyAlert/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
